name: Refresh profile README

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - today.py
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-readme-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README and activity cards
        env:
          GH_USERNAME: ${{ github.repository_owner }}
        run: python3 today.py

      - name: Publish changed files
        run: |
          git add README.md dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh profile README'
          git push
